<a class="skip-link" href="#main-content">Pular para o conteúdo</a>

<div class="shell">
  <div
    class="scrim"
    [class.is-visible]="drawerOpen()"
    aria-hidden="true"
    (click)="closeDrawer(true)"
  ></div>

  <aside class="sidebar" [class.is-open]="drawerOpen()" aria-label="Navegação principal">
    <div class="sidebar__top">
      <a class="brand" routerLink="/overview" aria-label="DevPilot AI — visão geral">
        <span class="brand__mark" aria-hidden="true">
          <app-icon name="sparkles" [size]="18" [strokeWidth]="2" />
        </span>
        <span class="brand__name">DevPilot <strong>AI</strong></span>
      </a>

      <button
        #drawerCloseButton
        type="button"
        class="icon-button sidebar__close"
        aria-label="Fechar navegação"
        (click)="closeDrawer(true)"
      >
        <app-icon name="close" [size]="20" />
      </button>
    </div>

    <nav id="primary-navigation" class="nav" aria-label="Navegação do espaço de trabalho">
      @for (item of navItems; track item.key) {
        <a
          class="nav__link"
          [routerLink]="item.path"
          [class.is-active]="isActive(item)"
          [attr.aria-current]="isActive(item) ? 'page' : null"
        >
          <app-icon [name]="item.icon" [size]="18" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <section class="account" aria-label="Conta">
        <div class="account__identity">
          <span class="account__avatar" aria-hidden="true">V</span>
          <div class="account__meta">
            <p class="account__name">Visitante</p>
            <p class="account__detail">Sem sessão ativa</p>
          </div>
        </div>
        <app-button variant="secondary" size="sm" [fullWidth]="true" (click)="auth.open()">
          <app-icon name="lock" [size]="14" />
          Entrar
        </app-button>
      </section>

      <app-service-status />
    </div>
  </aside>

  <div class="content" [attr.inert]="drawerOpen() ? '' : null">
    <header class="mobile-bar">
      <button
        #menuButton
        type="button"
        class="icon-button"
        aria-label="Abrir navegação"
        aria-controls="primary-navigation"
        [attr.aria-expanded]="drawerOpen()"
        (click)="openDrawer()"
      >
        <app-icon name="menu" [size]="22" />
      </button>

      <a class="brand brand--compact" routerLink="/overview" aria-label="DevPilot AI — visão geral">
        <span class="brand__mark" aria-hidden="true">
          <app-icon name="sparkles" [size]="16" [strokeWidth]="2" />
        </span>
        <span class="brand__name">DevPilot <strong>AI</strong></span>
      </a>

      <span class="mobile-bar__spacer" aria-hidden="true"></span>
    </header>

    <main id="main-content" class="content__main" tabindex="-1">
      <router-outlet />
    </main>

    <footer class="content__footer">
      <p>DevPilot AI · análise multiagente de código</p>
      <p class="content__footer-meta">Feito para revisar com contexto</p>
    </footer>
  </div>
</div>

<app-login-prompt />
