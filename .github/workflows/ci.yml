name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app tests alembic

      - name: Run tests
        run: python -m pytest -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Angular 21 requires Node 20.19+/22.12+/24+; cache follows the
      # frontend lockfile so CI and Pages resolve the same dependency tree.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check application
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Type check tests
        run: npx tsc --noEmit -p tsconfig.spec.json

      - name: Build production bundle
        run: npx ng build --configuration production

      - name: Run unit tests
        run: npx ng test --watch=false
