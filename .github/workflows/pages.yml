name: Deploy DevPilot AI frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Configure esta variável pública em Settings > Secrets and variables > Actions.
  # Publicar sem ela geraria uma SPA sem backend: o job build falha antes.
  DEVPILOT_API_URL: ${{ vars.DEVPILOT_API_URL }}

jobs:
  verify:
    name: Verificar qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências Python
        run: python -m pip install -r requirements.txt

      - name: Compilar Python
        run: python -m compileall -q app tests alembic

      - name: Executar testes Python
        run: python -m pytest -p no:cacheprovider

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Verificar tipos da aplicação
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Verificar tipos dos testes
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.spec.json

      - name: Executar testes do frontend
        working-directory: frontend
        run: npx ng test --watch=false

      - name: Build de produção do frontend
        working-directory: frontend
        run: npx ng build --configuration production

  build:
    name: Preparar frontend estático
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      # O Pages publica uma SPA que chama a API pública: sem URL configurada o
      # site não tem backend. Falhar aqui evita publicar um artefato quebrado.
      - name: Validar URL pública da API
        shell: bash
        env:
          API_BASE_URL: ${{ env.DEVPILOT_API_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${API_BASE_URL//[[:space:]]/}" ]]; then
            echo "::error title=DEVPILOT_API_URL ausente::Defina a repository variable DEVPILOT_API_URL (Settings > Secrets and variables > Actions > Variables) antes de publicar o frontend."
            exit 1
          fi

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # O Angular 21 exige Node 20.19+, 22.12+ ou 24+. O cache npm usa o
      # lockfile do frontend, a única árvore de dependências do build.
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `configure-pages` devolve "/" em user pages e "/<repo>" em project
      # pages. O runtime config e o base href usam a forma sem barra final
      # ("" ou "/devpilot-ai"). O config.js é gravado em public/ antes do
      # build para ser copiado para dist/ como asset estático.
      - name: Gerar config.js de runtime
        shell: bash
        env:
          API_BASE_URL: ${{ env.DEVPILOT_API_URL }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail

          base_path="${PAGES_BASE_PATH%/}"
          if [[ "$base_path" == "/" || -z "$base_path" ]]; then
            base_path=""
          fi

          node frontend/scripts/write-config.mjs \
            --api-base-url "$API_BASE_URL" \
            --base-path "$base_path" \
            --out frontend/public/config.js

          # Compartilha o caminho normalizado com o build e as validações.
          echo "BASE_PATH=$base_path" >> "$GITHUB_ENV"

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      # `--base-href` precisa terminar em "/" para o browser resolver os
      # assets relativos (main-*.js, styles-*.css, media/) no subpath.
      - name: Build de produção
        working-directory: frontend
        shell: bash
        run: npx ng build --configuration production --base-href "${BASE_PATH}/"

      # O artefato é montado em $RUNNER_TEMP: o `./site` do checkout pode ser
      # um mount local e nunca deve ser removido ou sobrescrito pelo workflow.
      - name: Montar e validar artefato
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="${RUNNER_TEMP:?RUNNER_TEMP não definido}/site"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          cp -a frontend/dist/. "$artifact_dir/"
          touch "$artifact_dir/.nojekyll"

          python - "$artifact_dir" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          problems = []

          def require(condition, message):
              if not condition:
                  problems.append(message)

          index_path = root / "index.html"
          config_path = root / "config.js"

          require(index_path.is_file(), "index.html ausente no artefato")
          require(config_path.is_file(), "config.js ausente no artefato")
          if config_path.is_file():
              config_text = config_path.read_text(encoding="utf-8")
              require("window.DevPilotConfig" in config_text, "config.js não define window.DevPilotConfig")
              require("apiBaseUrl" in config_text, "config.js não contém apiBaseUrl")

          main_assets = sorted(root.glob("main-*.js"))
          style_assets = sorted(root.glob("styles-*.css"))
          require(bool(main_assets), "nenhum main-*.js encontrado")
          require(bool(style_assets), "nenhum styles-*.css encontrado")

          if index_path.is_file():
              html = index_path.read_text(encoding="utf-8")

              # Scripts, folhas de estilo e modulepreload precisam ser locais:
              # as fontes vêm do fontsource e não há CDN no bundle.
              references = []
              for tag in re.finditer(r'<(?:script|link)\b[^>]*>', html, re.I):
                  references.extend(re.findall(r'\b(?:src|href)=["\']([^"\']+)["\']', tag.group(0), re.I))

              for reference in references:
                  if re.match(r'^(?:https?:)?//', reference, re.I):
                      problems.append(f"asset com URL absoluta no index.html: {reference}")
                      continue
                  clean = reference.split("?", 1)[0].split("#", 1)[0]
                  if clean == "" or clean.startswith(("data:", "mailto:", "#")):
                      continue
                  if not (index_path.parent / clean).resolve().is_file():
                      problems.append(f"asset referenciado não existe: {reference}")

              config_tag = re.search(r'<script\b[^>]*\bsrc=["\'](?:\./)?config\.js["\']', html, re.I)
              main_tag = re.search(r'<script\b[^>]*\bsrc=["\'](?:\./)?main-[^"\']+\.js["\']', html, re.I)
              require(config_tag is not None, "index.html não carrega config.js")
              require(main_tag is not None, "index.html não carrega o bundle main-*.js")
              if config_tag is not None and main_tag is not None:
                  require(
                      config_tag.start() < main_tag.start(),
                      "config.js deve ser carregado antes do bundle principal",
                  )

              base_tag = re.search(r'<base\b[^>]*\bhref=["\']([^"\']+)', html, re.I)
              expected_base = (os.environ.get("BASE_PATH", "").rstrip("/") or "") + "/"
              require(base_tag is not None, "index.html não define <base href>")
              if base_tag is not None:
                  require(
                      base_tag.group(1) == expected_base,
                      f"base href {base_tag.group(1)!r} diferente de {expected_base!r}",
                  )

          for css in style_assets:
              if re.search(r'url\(\s*["\']?https?://', css.read_text(encoding="utf-8"), re.I):
                  problems.append(f"CSS contém recurso remoto: {css.name}")

          if problems:
              for problem in problems:
                  print(problem, file=sys.stderr)
              sys.exit(1)

          print(
              "Artefato validado: index.html, config.js, "
              f"{len(main_assets)} main-*.js, {len(style_assets)} styles-*.css, "
              "config.js antes do bundle e assets relativos."
          )
          PY

      - name: Testar publicação em subpath
        shell: bash
        run: |
          set -euo pipefail

          smoke_root="${RUNNER_TEMP:?RUNNER_TEMP não definido}/pages-smoke"
          smoke_prefix="${BASE_PATH:-/devpilot-ai}"
          artifact_dir="${RUNNER_TEMP}/site"
          smoke_dir="${smoke_root}${smoke_prefix}"
          base_url="http://127.0.0.1:8765${smoke_prefix}"

          rm -rf "$smoke_root"
          mkdir -p "$smoke_dir"
          cp -a "$artifact_dir/." "$smoke_dir/"

          python -m http.server 8765 --directory "$smoke_root" >"$smoke_root/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1

          curl --fail --silent --show-error "$base_url/index.html" -o "$smoke_root/fetched-index.html"
          curl --fail --silent --show-error "$base_url/config.js" >/dev/null

          main_asset="$(cd "$artifact_dir" && ls main-*.js | head -n 1)"
          style_asset="$(cd "$artifact_dir" && ls styles-*.css | head -n 1)"
          font_asset="$(cd "$artifact_dir" && ls media/*.woff2 | head -n 1)"

          curl --fail --silent --show-error "$base_url/$main_asset" >/dev/null
          curl --fail --silent --show-error "$base_url/$style_asset" >/dev/null
          curl --fail --silent --show-error "$base_url/$font_asset" >/dev/null

          python - "$smoke_root/fetched-index.html" <<'PY'
          import re
          import sys
          from pathlib import Path

          html = Path(sys.argv[1]).read_text(encoding="utf-8")
          config_tag = re.search(r'<script\b[^>]*\bsrc=["\'](?:\./)?config\.js["\']', html, re.I)
          main_tag = re.search(r'<script\b[^>]*\bsrc=["\'](?:\./)?main-[^"\']+\.js["\']', html, re.I)
          if config_tag is None or main_tag is None or config_tag.start() > main_tag.start():
              print("config.js não é carregado antes do bundle no HTML servido.", file=sys.stderr)
              sys.exit(1)
          PY

          echo "Smoke em subpath OK: $base_url (index.html, config.js, $main_asset, $style_asset, $font_asset)."

      - name: Publicar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # O artifact continua com o mesmo formato; apenas a origem mudou.
          path: ${{ runner.temp }}/site

  deploy:
    name: Publicar no GitHub Pages
    needs: [verify, build]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Fazer deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
