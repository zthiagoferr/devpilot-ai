[alembic]
# Migration scripts are stored with the application.
script_location = %(here)s/app/migrations
prepend_sys_path = %(here)s

# The real URL must be supplied through the environment by env.py or deployment
# configuration. Do not place credentials in this file.
sqlalchemy.url = ${DATABASE_URL}

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
# Keep engine and connection details, including potentially sensitive values,
# out of migration logs.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
