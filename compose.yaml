services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: production
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-devpilot_local}:${POSTGRES_PASSWORD:-devpilot_local_password}@postgres:5432/${POSTGRES_DB:-devpilot_local}"
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devpilot_local}
      POSTGRES_USER: ${POSTGRES_USER:-devpilot_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpilot_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
